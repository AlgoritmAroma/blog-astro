name: Prod Deploy

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push blog image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-blog:${{ github.ref_name }}
        run: |
          IMAGE=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          echo "Using image name: $IMAGE"
          docker build -t $IMAGE ./apps/blog
          docker push $IMAGE

      - name: Build and push admin image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-admin:${{ github.ref_name }}
        run: |
          IMAGE=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          echo "Using image name: $IMAGE"
          docker build -t $IMAGE ./apps/admin
          docker push $IMAGE

  sync:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose.yaml to prod server
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ vars.PROD_SERVER_HOST }}
          username: ${{ vars.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: 'compose.yaml'
          target: ${{ vars.PROD_SERVER_DIR }}/blog/

  deploy:
    runs-on: ubuntu-latest
    needs: [build, sync]
    steps:
      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.PROD_SERVER_HOST }}
          username: ${{ vars.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cat <<'EOF' > ${{ vars.PROD_SERVER_DIR }}/blog/.env
            ${{ secrets.PROD_ENV_BLOG }}
            IMAGE_TAG=${{ github.ref_name }}
            EOF

            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker-compose -f ${{ vars.PROD_SERVER_DIR }}/blog/compose.yaml pull
            docker-compose -f ${{ vars.PROD_SERVER_DIR }}/blog/compose.yaml -p blog-astro down
            docker-compose -f ${{ vars.PROD_SERVER_DIR }}/blog/compose.yaml -p blog-astro up -d
